name: Merge evidence gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-evidence-gate:
    name: Merge evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # edited はタイトル・base の変更でも発火するが、このゲートが読むのは PR 本文だけ。
    # 本文の修正で再判定できなくなると証跡を足しても赤いままになるので edited 自体は残し、
    # 本文が変わっていない edited だけをここで除外する
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Require notification evidence in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-evidence-gate.mjs
