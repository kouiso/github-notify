name: Fix Issue Headings

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix-headings:
    name: Normalize issue heading levels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Normalize issue heading levels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          body_file="${RUNNER_TEMP}/issue-body.md"
          fixed_file="${RUNNER_TEMP}/issue-body-fixed.md"

          jq -r '.issue.body // empty' "$GITHUB_EVENT_PATH" > "$body_file"

          if [[ ! -s "$body_file" ]]; then
            echo "Issue body is empty; nothing to normalize."
            exit 0
          fi

          sed -E 's/^### /## /; s/^#### /### /' "$body_file" > "$fixed_file"

          if cmp -s "$body_file" "$fixed_file"; then
            echo "Issue heading levels are already normalized."
            exit 0
          fi

          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --field "body=@${fixed_file}"
