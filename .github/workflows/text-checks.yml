name: Text Checks

# issue・PR の本文の書き方チェックと公開内容チェック、およびコメントの公開内容チェック（#99）。
# 判定の本体は .github/scripts/text-checks/（brain #110 の写し）、呼び出しは .github/scripts/text-checks-caller.cjs の run()。
# 本文・コメントの自動編集・自動削除はしない。知らせるのは目印つきのコメントだけ。
#
# 見る場所:
# - 結果を確かめる信頼できる手がかりは、元のコメントへのリンクつきの知らせのコメント。
#   issue_comment・workflow_run・schedule の実行は PR の head ではなく既定ブランチに紐づくので、
#   コメントごとのチェックの色は PR 上では当てにならない。毎時の総ざらいだけは NG を警告にとどめる（直るまで赤くなり続けるため）。
# - コメントが NG のたびに知らせが1件ずつ増える（スパムは 1:1 で増える）。今の規模では許容し、直る・消えると知らせも消す。
#
# fork の PR のレビュー系イベントは信用できないので、text-checks-review-relay.yml が PR の番号だけを artifact で渡し、
# ここの workflow_run（既定ブランチのコード・書き込み権限）が、その PR のレビューとレビューコメントを全部取り直して検査する。
# マージ・クローズ済みの PR も、実行の head と sha が完全に一致すれば対象にする。
# 中継は PR の作者が書き換えたり消したりでき、衝突や初回投稿者の承認待ちでそもそも動かないこともある。
# その取りこぼしを拾うため、毎時と手動で、開いた PR と、最近（3時間以内）閉じた・レビューコメントが更新された PR をすべて総ざらいする（schedule / workflow_dispatch）。
# 限界: レビュー本文には、リポ全体を新しい順に引ける一覧が無い。そのため、古い閉じた PR のレビュー本文を後から編集しても、
# PR の updated_at が動かない限り拾えない。古い閉じた PR のレビューコメントの削除も拾えない（残った知らせは次に触れた時に片づく）。
# 実行回数: レビュー系の1イベントにつき中継と検査の2回、総ざらいは1日24回。公開リポで標準の runner は無料。
# pull_request_target でも PR 側のコードは取り出さない（checkout は既定ブランチのまま）。
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Text Checks Relay]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  # 中継の artifact を読むため
  actions: read

# コメントの検査が本文の検査や別のコメントの検査を打ち切らないよう、イベント名とコメントの id まで含める。
# 同じコメントの連続編集だけが古い実行を打ち切る。
# workflow_run は PR の番号が分からないので、workflow の path・event・head のリポジトリ・ブランチ・sha ごとに分ける。同じコミットへの連続したレビューは新しい実行が古い実行を兼ねる（PR の全レビューを取り直すため）が、
# 別のコミットの実行は打ち切らない。path と event を含めるのは、PR 側で同じ名前の別の workflow を作られても、本物の中継の実行を打ち切れないようにするため。
# 総ざらいは1つにまとめて積み上げない。接頭辞が違うので、他のグループ（番号が先頭）とは重ならない。
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'text-checks-sweep' || github.event_name == 'workflow_run' && format('text-checks-wr-{0}-{1}-{2}-{3}-{4}', github.event.workflow_run.path, github.event.workflow_run.event, github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch, github.event.workflow_run.head_sha || github.event.workflow_run.id) || format('text-checks-{0}-{1}-{2}', github.event.issue.number || github.event.pull_request.number, github.event_name, github.event.comment.id || 'body') }}
  cancel-in-progress: true

jobs:
  check:
    # 本文とコメントを PR 上で見分けられるよう、名前を分ける。
    name: ${{ (github.event_name == 'issues' || github.event_name == 'pull_request_target') && 'Check issue / PR text' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'Sweep PR reviews' || 'Check comment text' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch (no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/text-checks/public_text_check.py
            .github/scripts/text-checks/format_check.py
            .github/scripts/text-checks-caller.cjs
            .github/text-checks.config.json
            .github/text-checks.headings.json
          sparse-checkout-cone-mode: false
      - name: Run checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # 追加の禁止語（顧客名・固有の語など、1行1語）。リポにもログにも置かない。
          # runner の一時ファイルに書いて本体へ PUBLIC_TEXT_EXTRA_FILE で渡す。未設定なら一般の規則だけで判定する。
          PUBLIC_TEXT_EXTRA: ${{ secrets.PUBLIC_TEXT_EXTRA }}
        with:
          script: |
            const checks = require('./.github/scripts/text-checks-caller.cjs');
            const config = require('./.github/text-checks.config.json');
            const extraFile = checks.writeExtraFile(process.env.PUBLIC_TEXT_EXTRA, process.env.RUNNER_TEMP);
            await checks.run({ github, context, core, config, extraFile });
