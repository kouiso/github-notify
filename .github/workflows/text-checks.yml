name: Text Checks

# issue・PR の本文の書き方チェックと公開内容チェック、およびコメントの公開内容チェック（#99）。
# 判定の本体は .github/scripts/text-checks/（brain #110 の写し）、呼び出しは .github/scripts/text-checks-caller.cjs の run()。
# 本文・コメントの自動編集・自動削除はしない。知らせるのは目印つきのコメントだけ。
#
# 見る場所:
# - 結果を確かめる信頼できる手がかりは、元のコメントへのリンクつきの知らせのコメント。
#   issue_comment と workflow_run の実行は PR の head ではなく既定ブランチに紐づくので、
#   コメントごとのチェックの色は PR 上では当てにならない（失敗は Actions の実行一覧に出る）。
# - コメントが NG のたびに知らせが1件ずつ増える（スパムは 1:1 で増える）。今の規模では許容し、直る・消えると知らせも消える。
#
# fork の PR のレビュー系イベントは text-checks-review-relay.yml が artifact で番号だけ渡し、
# ここの workflow_run が既定ブランチのコードと書き込み権限で API から取り直して検査する。
# pull_request_target でも PR 側のコードは取り出さない（checkout は既定ブランチのまま）。
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Text Checks Relay]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  # workflow_run で中継の artifact を読むため
  actions: read

# コメントの検査が本文の検査や別のコメントの検査を打ち切らないよう、イベント名とコメントの id まで含める。
# 同じコメントの連続編集だけが古い実行を打ち切る。workflow_run は番号が分からないので実行ごとに分ける。
concurrency:
  group: text-checks-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.id }}-${{ github.event_name }}-${{ github.event.comment.id || 'body' }}
  cancel-in-progress: true

jobs:
  check:
    # 本文とコメントを PR 上で見分けられるよう、名前を分ける。
    name: ${{ (github.event_name == 'issues' || github.event_name == 'pull_request_target') && 'Check issue / PR text' || 'Check comment text' }}
    # 中継の実行が失敗・取り消しのときは何も渡されていないので動かさない。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch (no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/text-checks/public_text_check.py
            .github/scripts/text-checks/format_check.py
            .github/scripts/text-checks-caller.cjs
            .github/text-checks.config.json
            .github/text-checks.headings.json
          sparse-checkout-cone-mode: false
      - name: Run checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # 追加の禁止語（顧客名・固有の語など、1行1語）。リポにもログにも置かない。
          # runner の一時ファイルに書いて本体へ PUBLIC_TEXT_EXTRA_FILE で渡す。未設定なら一般の規則だけで判定する。
          PUBLIC_TEXT_EXTRA: ${{ secrets.PUBLIC_TEXT_EXTRA }}
        with:
          script: |
            const checks = require('./.github/scripts/text-checks-caller.cjs');
            const config = require('./.github/text-checks.config.json');
            const extraFile = checks.writeExtraFile(process.env.PUBLIC_TEXT_EXTRA, process.env.RUNNER_TEMP);
            await checks.run({ github, context, core, config, extraFile });
