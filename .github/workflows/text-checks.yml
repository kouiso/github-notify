name: Text Checks

# issue・PR の本文の書き方チェックと公開内容チェック、およびコメントの公開内容チェック（#99）。
# きっかけは本文・コメント・レビューの作成と編集だけ。コメントは issue コメント（PR 上のものを含む）、PR のレビューコメント（行ごと）、レビュー本文。
# 書き方チェックは本文だけで、コメントには公開内容チェックだけを掛ける。
# 判定は brain #110 の本体の写し .github/scripts/text-checks/（Python 3 標準ライブラリのみ、出どころは
# .github/text-checks.source.json）。呼び出しと知らせる文は .github/scripts/text-checks-caller.cjs、設定は .github/text-checks.config.json。
# 本文・コメントの自動編集・自動削除はしない。目印つきのコメントを検査の種類ごと（コメントは1件ごと）に1つ作り、直れば同じコメントを更新する。
# 知らせには元のコメントの URL と規則名・行・件数だけを書き、当たった文字は書かない。
# 公開内容チェックは起こしたのが誰でも必ず動く（ただしこのワークフロー自身の知らせと Actions のボットのコメントは見ない。無限ループになるため）。
# ボットを飛ばすのは書き方チェックだけ（caller の shouldSkipFormat）。
# pull_request_target でも PR 側のコードは取り出さない（checkout は既定ブランチのまま）。
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

# コメントの検査が本文の検査や別のコメントの検査を打ち切らないよう、イベント名とコメント・レビューの id まで含める。
# 同じコメントの連続編集だけが古い実行を打ち切る。
concurrency:
  group: text-checks-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event_name }}-${{ github.event.comment.id || github.event.review.id || 'body' }}
  cancel-in-progress: true

jobs:
  check:
    name: Check issue / PR text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch (no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/text-checks/public_text_check.py
            .github/scripts/text-checks/format_check.py
            .github/scripts/text-checks-caller.cjs
            .github/text-checks.config.json
            .github/text-checks.headings.json
          sparse-checkout-cone-mode: false
      - name: Run checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # 追加の禁止語（顧客名・固有の語など、1行1語）。リポにもログにも置かない。
          # runner の一時ファイルに書いて本体へ PUBLIC_TEXT_EXTRA_FILE で渡す。未設定なら一般の規則だけで判定する。
          PUBLIC_TEXT_EXTRA: ${{ secrets.PUBLIC_TEXT_EXTRA }}
        with:
          script: |
            const checks = require('./.github/scripts/text-checks-caller.cjs');
            const config = require('./.github/text-checks.config.json');
            const extraFile = checks.writeExtraFile(process.env.PUBLIC_TEXT_EXTRA, process.env.RUNNER_TEMP);
            const { owner, repo } = context.repo;

            const target = checks.resolveTarget(context.eventName, context.payload);
            const { number, body, author, kind, labels, draft, comment } = target;

            // このワークフロー自身の知らせ（目印で始まる）と Actions のボットのコメントは見ない。見ると知らせが知らせを呼ぶ。
            if (comment && checks.shouldSkipComment(target, config)) {
              core.info('自分の知らせ、または Actions のボットのコメントなので検査しません。');
              return;
            }

            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            // 同じ目印のコメントがあれば更新、なければ「要確認」のときだけ新規に作る。
            // fork の PR では token が読み取り専用で 403 になるので、書けなくても判定は続けて下で落とす。
            async function upsert(key, text, ok) {
              const marker = `${config.marker}:${key}`;
              const found = existing.find((c) => (c.body || '').startsWith(marker + '\n'));
              if (found) {
                if (found.body !== text) {
                  await checks.writeOrWarn(
                    () => github.rest.issues.updateComment({ owner, repo, comment_id: found.id, body: text }),
                    core.warning,
                  );
                }
              } else if (!ok) {
                await checks.writeOrWarn(
                  () => github.rest.issues.createComment({ owner, repo, issue_number: number, body: text }),
                  core.warning,
                );
              }
            }

            const failures = [];

            // 本文が空（承認だけのレビューなど）は書いてはいけないものが無いので OK。以前の指摘が残っていれば OK に更新する。
            const pub = checks.runPublicCheck(body, { extraFile });
            const pubKey = comment ? checks.commentKey(comment) : 'public-body';
            await upsert(pubKey, checks.formatReport('public', pub, config, pubKey, comment ? comment.url : null), pub.ok);
            if (!pub.ok) failures.push(`公開内容チェック: ${checks.groupHits(pub.hits).map((g) => g.rule).join(', ')}`);

            // 書き方チェックは本文だけ。コメントでは見ない。
            if (!comment) {
              if (!checks.shouldSkipFormat({ kind, author, labels, draft }, config)) {
                const fmt = checks.runFormatCheck(body, kind === 'issue' ? 'issue' : 'pr');
                await upsert('format', checks.formatReport('format', fmt, config), fmt.ok);
                if (!fmt.ok) failures.push(`書き方チェック: ${fmt.problems.length}件不足`);
              } else {
                // 対象外でも upsert は通す。対象になる前の指摘コメントが残り続けるのを防ぐため
                const skipped = `${config.marker}:format\n書き方チェック: 対象外（ボット・下書き・対象外ラベルのため検査していません）`;
                await upsert('format', skipped, true);
              }
            }

            if (failures.length > 0) core.setFailed(failures.join(' / '));
            else core.info('All text checks passed.');
